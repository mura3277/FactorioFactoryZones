[item-name]
region-marker-tool=Region Marker

[item-description]
region-marker-tool=Drag to mark a rectangular region on the map. Alt-drag to remove one. Click an existing region to rename, recolor, or delete it.

[shortcut-name]
give-region-marker-tool=Region Marker

[mod-setting-name]
region-marker-click-tolerance=Click tolerance
region-marker-rectangle-color=Default region color
region-marker-line-width=Line width
region-marker-text-scale=Label text scale

[mod-setting-description]
region-marker-click-tolerance=How small a drag (in tiles) counts as a click on an existing region rather than drawing a new one.
region-marker-rectangle-color=Default color for newly drawn regions.
region-marker-line-width=Border thickness of region rectangles, in pixels.
region-marker-text-scale=Size of each region's name label on the map.
